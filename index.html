}

// Mismas reglas que el propio CRM (src/lib/consultas.js), para que las cifras coincidan.
const isoADias = (iso) => { const m = String(iso || "").match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? Math.floor(Date.UTC(+m[1], +m[2] - 1, +m[3]) / 86400000) : null; };
const diasAIso = (n) => new Date(n * 86400000).toISOString().slice(0, 10);
const esCuotaDeContinuacion = (concepto) => { const m = /^Cuota\s*(\d+)/i.exec(String(concepto || "").trim()); return m ? Number(m[1]) > 1 : false; };

function crmVentas(doc) {
  const out = [];
  for (const c of doc.clientes) {
    const ciclos = (Array.isArray(c.historialCiclos) && c.historialCiclos.length > 0 ? c.historialCiclos
      : c.importe ? [{ fecha: c.fechaInicio, modalidad: c.modalidad, importe: c.importe, semanasTotal: c.semanasTotal, motivo: "alta" }] : [])
      .slice().sort((a, b) => String(a.fecha).localeCompare(String(b.fecha)));
    const disparadores = doc.cobros.filter(co => co.clienteId === c.id && !esCuotaDeContinuacion(co.concepto))
      .sort((a, b) => String(a.fechaPago).localeCompare(String(b.fechaPago)));
    let j = 0;
    ciclos.forEach((h, i) => {
      const limite = ciclos[i + 1] && ciclos[i + 1].fecha;
      let fecha = h.fecha;
      if (j < disparadores.length && (!limite || String(disparadores[j].fechaPago) < String(limite))) { fecha = disparadores[j].fechaPago; j++; }
      out.push({ clienteId: c.id, fecha, importe: Number(h.importe) || 0, motivo: h.motivo === "renovacion" ? "renovacion" : "alta" });
    });
  }
  return out;
}

function crmEventosRenovacion(doc, hoy) {
  const ev = [];
  for (const c of doc.clientes) {
    const ciclos = Array.isArray(c.historialCiclos) ? c.historialCiclos : [];
    ciclos.forEach((h, i) => {
      if (i < ciclos.length - 1) { ev.push({ fecha: ciclos[i + 1].fecha, renovo: true, estado: c.estado }); return; }
      const ini = isoADias(h.fecha); const sem = Number(h.semanasTotal) || 0;
      const fin = ini != null && sem > 0 ? diasAIso(ini + sem * 7) : h.fecha;
      if (c.estado === "Finalizado" || c.estado === "Baja") { ev.push({ fecha: fin, renovo: false, estado: c.estado }); return; }
      if (ini == null || sem <= 0) return;
      if (ini + sem * 7 <= hoy) ev.push({ fecha: fin, renovo: true, estado: c.estado });
    });
  }
  return ev;
}

// Resumen del CRM mes a mes: { "2026-10": { cobrado, facturacion, altas, ... } }
function crmPorMes(doc) {
  const hoy = isoADias(new Date().toISOString().slice(0, 10));
  const M = {};
  const m = (k) => M[k] || (M[k] = { cobrado: 0, nCobros: 0, facturacion: 0, nVentas: 0, altas: 0, renovVentas: 0, contratadoR: 0, recaudadoR: 0, aRenovar: 0, renovaron: 0, bajas: 0 });
  const ventas = crmVentas(doc);
  const ventasCli = {};
  ventas.forEach(v => { (ventasCli[v.clienteId] = ventasCli[v.clienteId] || []).push(v); const x = m(String(v.fecha).slice(0, 7)); x.facturacion += v.importe; x.nVentas++; if (v.motivo === "alta") x.altas++; else { x.renovVentas++; x.contratadoR += v.importe; } });
  Object.values(ventasCli).forEach(l => l.sort((a, b) => String(a.fecha).localeCompare(String(b.fecha))));
  doc.cobros.forEach(co => {
    if (co.estado !== "Cobrado" || !co.fechaPago) return;
    const x = m(String(co.fechaPago).slice(0, 7)); const imp = Number(co.importe) || 0;
    x.cobrado += imp; x.nCobros++;
    // ¿a qué ciclo pertenece el cobro? al último que se vendió antes o ese mismo día
    const l = ventasCli[co.clienteId] || []; let ciclo = null;
    l.forEach(v => { if (String(v.fecha) <= String(co.fechaPago)) ciclo = v; });
    if (ciclo && ciclo.motivo === "renovacion") x.recaudadoR += imp;
  });
  crmEventosRenovacion(doc, hoy).forEach(e => { const x = m(String(e.fecha).slice(0, 7)); x.aRenovar++; if (e.renovo) x.renovaron++; else if (e.estado === "Baja") x.bajas++; });
  return M;
}

// Clientes en programa en una fecha (desde su primer ciclo hasta el fin del último; si siguen activos, hasta hoy o más)
function crmActivosEn(doc, iso) {
  const d = isoADias(iso); const hoy = isoADias(new Date().toISOString().slice(0, 10));
  if (d == null || d > hoy) return null;
  let n = 0;
  for (const c of doc.clientes) {
    const ciclos = (Array.isArray(c.historialCiclos) && c.historialCiclos.length ? c.historialCiclos : [{ fecha: c.fechaInicio, semanasTotal: c.semanasTotal }])
      .filter(h => isoADias(h.fecha) != null).sort((a, b) => String(a.fecha).localeCompare(String(b.fecha)));
    if (!ciclos.length) continue;
    const ini = isoADias(ciclos[0].fecha); const ult = ciclos[ciclos.length - 1];
    let fin = isoADias(ult.fecha) + (Number(ult.semanasTotal) || 0) * 7;
    if (c.estado === "Activo" || c.estado === "Renovado") fin = Math.max(fin, hoy);
    if (ini <= d && d < fin) n++;
  }
  return n;
}

// ---------- Cálculos ----------
const BUCKET = { "Inbound DM": "inbound", "Inbound Comentario": "inbound", "Bienvenida": "outbound", "Otro": "outbound", "Lead Magnet": "lm" };

function leadMetrics(leads, bienvenidas, from, to) {
  const outbound = bienvenidas.reduce((s, b) => inRange(b.fecha, from, to) ? s + (Number(b.cantidad) || 0) : s, 0);
  const inbound = leads.filter(l => BUCKET[l.fuente] === "inbound" && inRange(l.fecha_creacion, from, to)).length;
  const lm = leads.filter(l => BUCKET[l.fuente] === "lm" && inRange(l.fecha_creacion, from, to)).length;
  const agOut = leads.filter(l => BUCKET[l.fuente] === "outbound" && inRange(l.fecha_agendada, from, to)).length;
  const agIn = leads.filter(l => BUCKET[l.fuente] === "inbound" && inRange(l.fecha_agendada, from, to)).length;
  const agLM = leads.filter(l => BUCKET[l.fuente] === "lm" && inRange(l.fecha_agendada, from, to)).length;
  const agendadas = agOut + agIn + agLM;
  const realizadas = leads.filter(l => inRange(l.fecha_realizada, from, to)).length;
  const cerradosL = leads.filter(l => l.etapa === "Cerrada" && inRange(l.fecha_cierre, from, to));
  return {
    outbound, agOut, indOut: outbound ? agOut / outbound : null,
    inbound, agIn, indIn: inbound ? agIn / inbound : null,
    lm, agLM, indLM: lm ? agLM / lm : null,
    agendadas, realizadas, showUp: agendadas ? realizadas / agendadas : null,
    cerradas: cerradosL.length, cierre: realizadas ? cerradosL.length / realizadas : null,
    recaudado: cerradosL.reduce((s, l) => s + (Number(l.recaudado) || 0), 0),
    contratado: cerradosL.reduce((s, l) => s + (Number(l.valor_contratado) || 0), 0),
  };
}

function gastosMes(gastos, key) { return gastos.filter(g => g.mes === key); }
function sumGastos(gastos, keys, categoria) {
  return gastos.filter(g => keys.includes(g.mes) && (!categoria || g.categoria === categoria))
    .reduce((s, g) => s + (Number(g.importe) || 0), 0);
}

function sugerencia(cat, key, gastos) {
  const tot = (k) => gastos.filter(g => g.mes === k && g.categoria === cat.nombre);
  if (cat.frecuencia === "mensual") {
    const prev = tot(shiftMes(key, -1));
    return prev.length ? round2(prev.reduce((s, g) => s + Number(g.importe || 0), 0)) : 0;
  }
  if (cat.frecuencia === "trimestral") {
    const m = Number(key.split("-")[1]);
    if (![1, 4, 7, 10].includes(m)) return 0;
    const prev = tot(shiftMes(key, -3));
    return prev.length ? round2(prev.reduce((s, g) => s + Number(g.importe || 0), 0)) : 0;
  }
  return 0;
}

// Categorías que cuentan como impuestos (para el % antes/después de impuestos)
const IMPUESTOS_POR_DEFECTO = ["IRPF", "IVA", "Autónomo"];
const esImpuesto = (c) => c.esImpuesto !== undefined ? !!c.esImpuesto : IMPUESTOS_POR_DEFECTO.includes(c.nombre);

// Métricas financieras de un conjunto de meses
function finMetrics(keys, gastos, mesesData, categorias) {
  const pubCat = (categorias.find(c => c.esPublicidad) || {}).nombre || "Publicidad";
  const rows = keys.map(k => mesesData[k] || {});
  const factVals = rows.map(r => r.facturacion).filter(v => v !== null && v !== undefined);
  const facturacion = factVals.length ? factVals.reduce((s, v) => s + Number(v), 0) : null;
  const gastosTot = sumGastos(gastos, keys);
  const tieneGastos = gastos.some(g => keys.includes(g.mes));
  const segVals = rows.map(r => r.seguidores_nuevos).filter(v => v !== null && v !== undefined);
  const segNuevos = segVals.length ? segVals.reduce((s, v) => s + Number(v), 0) : null;
  const totVals = rows.map(r => r.seguidores_totales).filter(v => v !== null && v !== undefined);
  const segTotales = totVals.length ? Number(totVals[totVals.length - 1]) : null;
  const ads = sumGastos(gastos, keys, pubCat);
  // Cash collected: lo que entra de verdad en el mes
  const cobVals = rows.map(r => r.cobrado).filter(v => v !== null && v !== undefined);
  const cobrado = cobVals.length ? cobVals.reduce((s, v) => s + Number(v), 0) : null;
  const impNombres = categorias.filter(esImpuesto).map(c => c.nombre);
  const impuestos = gastos.filter(g => keys.includes(g.mes) && impNombres.includes(g.categoria)).reduce((s, g) => s + (Number(g.importe) || 0), 0);
  const benDespues = cobrado !== null ? cobrado - gastosTot : null;
  const benAntes = cobrado !== null ? cobrado - (gastosTot - impuestos) : null;
  // Cuadro de la academia: beneficio bruto = facturación − gastos sin impuestos
  const beneficio = facturacion !== null ? facturacion - (gastosTot - impuestos) : null;
  return {
    facturacion, gastos: tieneGastos ? gastosTot : null, beneficio,
    margen: facturacion ? beneficio / facturacion : null,
    cobrado, impuestos: tieneGastos ? impuestos : null,
    devoluciones: tieneGastos ? gastos.filter(g => keys.includes(g.mes) && g.categoria === "Devoluciones" && Number(g.importe) > 0).length : null,
    gastosSinImp: tieneGastos ? gastosTot - impuestos : null,
    benAntes, benDespues,
    margenAntes: cobrado ? benAntes / cobrado : null,
    margenDespues: cobrado ? benDespues / cobrado : null,
    segNuevos, segTotales, ads: tieneGastos ? ads : null,
    cps: segNuevos ? ads / segNuevos : null,
  };
}

    <div style={{ background: COLORS.cream, borderRadius: 12, padding: "12px 14px", minWidth: 0 }}>

      <div style={{ fontSize: 22, fontWeight: 800, color: color || COLORS.ink, marginTop: 2 }}>{value}</div>
      {hint && <div style={{ fontSize: 11.5, color: COLORS.muted, marginTop: 2 }}>{hint}</div>}
    </div>
  );
}

// Input numérico que guarda al salir del campo o pulsar Enter
function NumInput({ value, placeholder, onSave, width = 110, align = "right", integer }) {
  const [v, setV] = useState(fmtInput(value));
  const [err, setErr] = useState(false);
  useEffect(() => { setV(fmtInput(value)); }, [value]);
  const commit = () => {
    const n = parseNum(v);
    if (Number.isNaN(n)) { setErr(true); return; }
    setErr(false);
    const out = n === null ? null : (integer ? Math.round(n) : round2(n));
    if (out !== (value === undefined ? null : value)) onSave(out);
  };
  return <input inputMode="decimal" value={v} placeholder={placeholder}
    onChange={e => { setV(e.target.value); setErr(false); }}
    onBlur={commit} onKeyDown={e => { if (e.key === "Enter") e.target.blur(); }}
    style={{ ...inputStyle, width, textAlign: align, borderColor: err ? COLORS.red : COLORS.line }} />;
}

class ErrorBoundary extends React.Component {
  constructor(p) { super(p); this.state = { error: null }; }
  static getDerivedStateFromError(error) { return { error }; }
  render() {
    if (this.state.error) return <div style={{ ...card, color: COLORS.red }}>Esta pestaña ha fallado: {String(this.state.error.message || this.state.error)}. El resto de la app sigue funcionando.</div>;
    return this.props.children;
  }
}

  const fm = finMetrics([mes], gastos, mesesEff || mesesData, categorias);

    if (!crmMes) return "Se rellenará solo al conectar el CRM";
    if (!cm || !n) return "El CRM no tiene datos este mes";
    const v = fmtMoney(cm[campo]);
    return md[campo === "cobrado" ? "cobrado" : "facturacion"] !== null && md[campo === "cobrado" ? "cobrado" : "facturacion"] !== undefined

  const confirmarPendientes = () => {
    const rows = pendientes.map(c => ({ id: uid(), mes, categoria: c.nombre, importe: sugerencia(c, mes, gastos), nota: null }));
    if (rows.length) actions.addGastos(rows);
  };

  const addGasto = () => {
    const n = parseNum(nuevo.importe);
    if (n === null || Number.isNaN(n)) { setAddErr("Escribe un importe válido"); return; }
    if (nuevo.categoria === "Otros" && !nuevo.nota.trim()) { setAddErr("En Otros, apunta el motivo (por ejemplo, Fontanero)"); return; }
    actions.addGastos([{ id: uid(), mes, categoria: nuevo.categoria, importe: round2(n), nota: nuevo.nota.trim() || null }]);
    setNuevo({ categoria: nuevo.categoria, importe: "", nota: "" }); setAddErr(""); setAddOpen(false);

      </div>

      <div style={card}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", marginBottom: 6 }}>
          <div style={{ fontWeight: 800, color: COLORS.navy }}>Gastos</div>
          <div style={{ fontSize: 12, color: COLORS.muted }}>En gris, lo que se confirmará si pulsas "Confirmar"</div>
        </div>
        {categorias.map(c => {
          const rows = delMes.filter(g => g.categoria === c.nombre);
          const sug = sugerencia(c, mes, gastos);
          return (
            <div key={c.nombre} style={{ padding: "8px 0", borderBottom: `1px solid ${COLORS.line}` }}>
              <div style={{ display: "grid", gridTemplateColumns: "minmax(0,1fr) auto auto", gap: 10, alignItems: "center" }}>
                <div style={{ fontSize: 14, fontWeight: 600, color: COLORS.ink }}>
                  {c.nombre} <span style={{ fontSize: 11, color: COLORS.muted, fontWeight: 500 }}>{c.frecuencia}</span>
                </div>
                {rows.length === 0 && <PendingRow sug={sug} onConfirm={(n) => actions.addGastos([{ id: uid(), mes, categoria: c.nombre, importe: n === null ? sug : n, nota: null }])} />}
                {rows.length === 1 && <>
                  <NumInput value={Number(rows[0].importe)} onSave={(n) => n === null ? actions.deleteGasto(rows[0].id) : actions.updateGasto({ ...rows[0], importe: n })} />
                  <button style={{ ...btn, padding: "6px 9px" }} title="Quitar (vuelve a pendiente)" onClick={() => actions.deleteGasto(rows[0].id)}>✕</button>
                </>}
                {rows.length > 1 && <>
                  <div style={{ fontWeight: 700, fontSize: 14, width: 110, textAlign: "right" }}>{fmtMoney(rows.reduce((s, g) => s + Number(g.importe || 0), 0))}</div>
                  <span style={{ width: 34 }} />
                </>}
              </div>
              {rows.length === 1 && rows[0].nota && <div style={{ fontSize: 12, color: COLORS.muted, marginTop: 2 }}>{rows[0].nota}</div>}
              {rows.length > 1 && rows.map(g => (

          )}

        </div>
      </div>

      <div style={card}>
        <div style={{ fontWeight: 800, color: COLORS.navy, marginBottom: 10 }}>Datos del mes</div>
        <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(180px, 1fr))", gap: 12 }}>
          <div><div style={label}>Facturación (vendido este mes, €)</div>
            <NumInput width="100%" align="left" value={md.facturacion ?? null} placeholder={cm && cm.nVentas ? fmtInput(cm.facturacion) : "4973"} onSave={(n) => actions.updateMes(mes, { facturacion: n })} />

          <div><div style={label}>Cash collected (cobrado este mes, €)</div>
            <NumInput width="100%" align="left" value={md.cobrado ?? null} placeholder={cm && cm.nCobros ? fmtInput(cm.cobrado) : "4509"} onSave={(n) => actions.updateMes(mes, { cobrado: n })} />
            <div style={{ fontSize: 11.5, color: COLORS.muted, marginTop: 4 }}>{crmHint("cobrado", cm && cm.nCobros)}</div></div>
          <div><div style={label}>Seguidores nuevos del mes</div>

        <div style={{ fontWeight: 800, color: COLORS.navy, marginBottom: 10 }}>Resultado de {mesLabel(mes)}</div>
        <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(150px, 1fr))", gap: 10 }}>

          <Stat title="Cash collected" value={fmtMoney(fm.cobrado)} hint={fm.cobrado === null ? "Sin datos todavía" : null} />

          <Stat title="Beneficio real" value={fmtMoney(fm.benDespues)} hint="Cash collected menos gastos" />
          <Stat title={`% antes de impuestos (objetivo ${objetivos.margen}%)`} value={fmtPct(fm.margenAntes)} color={mColor(fm.margenAntes, objetivos)} />
          <Stat title="% después de impuestos" value={fmtPct(fm.margenDespues)} />
        </div>
      </div>
    </div>
  );
}

function PendingRow({ sug, onConfirm }) {
  const [v, setV] = useState("");
  const [err, setErr] = useState(false);
  const go = () => {
    const n = parseNum(v);
    if (Number.isNaN(n)) { setErr(true); return; }
    onConfirm(n === null ? null : round2(n));
  };
  return <>
    <input inputMode="decimal" value={v} placeholder={fmtInput(sug)} onChange={e => { setV(e.target.value); setErr(false); }}
      onKeyDown={e => { if (e.key === "Enter") go(); }}
      style={{ ...inputStyle, width: 110, textAlign: "right", borderColor: err ? COLORS.red : COLORS.line, background: "#fffaf2" }} />
    <button style={{ ...btn, padding: "6px 9px", color: COLORS.amber, borderColor: `${COLORS.amber}66` }} onClick={go}>Confirmar</button>
  </>;
}

const mColor = (m, objetivos) => m === null || m === undefined ? null : (m * 100 >= objetivos.margen ? COLORS.green : COLORS.red);

function avg(arr) { const v = arr.filter(x => x !== null && x !== undefined); return v.length ? v.reduce((s, x) => s + x, 0) / v.length : null; }

// ---------- Cuadro de mandos ----------
// Cada fila: etiqueta, cómo calcularla para un conjunto de meses, formato y objetivo
function buildSecciones(objetivos) {
  const crm = (labelTxt, get, fmt = "int", extra = {}) => ({ label: labelTxt, crm: true, get: (f, l, c) => c ? get(c, f, l) : null, fmt, ...extra });
  return [
    { hoja: "Métricas clave", nombre: "Publicidad (atraer)", filas: [
      { label: "Nuevos seguidores", get: (f) => f.segNuevos, fmt: "int" },
      { label: "Inversión ads", get: (f) => f.ads, fmt: "eur" },
      { label: "Coste por seguidor", get: (f) => f.cps, fmt: "eur3", goal: `<${String(objetivos.cps).replace(".", ",")} €`, ok: (v) => v <= objetivos.cps },
      { label: "Seguidores totales", get: (f) => f.segTotales, fmt: "int" },
    ]},
    { hoja: "Métricas clave", nombre: "Ventas (convertir)", filas: [crm("Nº altas programa", c => c.altas)] },
    { hoja: "Métricas clave", nombre: "Finanzas (recoger)", filas: [
      { label: "Facturación total", get: (f) => f.facturacion, fmt: "eur" },
      { label: "Gastos totales (sin impuestos)", get: (f) => f.gastosSinImp, fmt: "eur" },
      { label: "Beneficio bruto", get: (f) => f.beneficio, fmt: "eur", goal: `>${objetivos.margen}%`, ok: (v, f) => f.margen !== null && f.margen * 100 >= objetivos.margen },
    ]},
    { hoja: "Métricas clave", nombre: "Servicio (entregar)", filas: [
      crm("Nº clientes activos", c => c.activos), crm("Nº clientes a renovar", c => c.aRenovar), crm("Renovaciones", c => c.renovaron),
      crm("% renovación", c => c.aRenovar ? c.renovaron / c.aRenovar : null, "pct", { goal: `>${objetivos.renovacion}%`, ok: (v) => v * 100 >= objetivos.renovacion }),
      crm("Bajas", c => c.bajas),
      { label: "Devoluciones", get: (f) => f.devoluciones, fmt: "int" },
    ]},
    { hoja: "Conversaciones", nombre: "Conversaciones", filas: [
      { label: "Outbound", get: (f, l) => l.outbound, fmt: "int" },
      { label: "Agendadas outbound", get: (f, l) => l.agOut, fmt: "int" },
      { label: "% inducción outbound", get: (f, l) => l.indOut, fmt: "pct", goal: `${objetivos.indOut}-4%`, ok: (v) => v * 100 >= objetivos.indOut },
      { label: "Inbound", get: (f, l) => l.inbound, fmt: "int" },
      { label: "Agendadas inbound", get: (f, l) => l.agIn, fmt: "int" },
      { label: "% inducción inbound", get: (f, l) => l.indIn, fmt: "pct", goal: `${objetivos.indIn}-50%`, ok: (v) => v * 100 >= objetivos.indIn },
    ]},
    { hoja: "Conversaciones", nombre: "Lead magnet (solo tuyo, no está en la academia)", extra: true, filas: [
      { label: "Lead magnet totales", get: (f, l) => l.lm, fmt: "int" },
      { label: "Agendadas LM", get: (f, l) => l.agLM, fmt: "int" },
      { label: "% inducción LM", get: (f, l) => l.indLM, fmt: "pct" },
    ]},
    { hoja: "Conversaciones", nombre: "Ventas", filas: [

      { label: "Realizadas", get: (f, l) => l.realizadas, fmt: "int" },

      { label: "Cerradas", get: (f, l) => l.cerradas, fmt: "int" },

      crm("Recaudado R", c => c.recaudadoR, "eur"), crm("Contratado R", c => c.contratadoR, "eur"),
      crm("Total recaudado", (c, f, l) => (l.recaudado || 0) + c.recaudadoR, "eur"),
      crm("Total contratado", (c, f, l) => (l.contratado || 0) + c.contratadoR, "eur"),
    ]},
  ];
}

// Suma del CRM para un grupo de meses (null si el CRM no está conectado)
function crmAgg(keys, doc, porMes) {
  if (!doc) return null;
  const sum = (k) => keys.reduce((s, m) => s + ((porMes[m] || {})[k] || 0), 0);
  return {
    altas: sum("altas"), aRenovar: sum("aRenovar"), renovaron: sum("renovaron"), bajas: sum("bajas"),
    recaudadoR: sum("recaudadoR"), contratadoR: sum("contratadoR"),
    activos: (() => {
      const hoyIso = new Date().toISOString().slice(0, 10);
      const fin = lastDay(keys[keys.length - 1]);
      if (fin <= hoyIso) return crmActivosEn(doc, fin);
      return `${keys[keys.length - 1]}-01` <= hoyIso ? crmActivosEn(doc, hoyIso) : null; // mes en curso: a día de hoy
    })(),
  };
}

const fmtBy = (v, f) => {
  if (v === null || v === undefined) return "—";
  if (f === "int") return fmtInt(v);
  if (f === "pct") return fmtPct(v);
  if (f === "eur3") return fmtMoney(v, 3);
  return fmtMoney(v, 2);
};
const tsvBy = (v, f) => {
  if (v === null || v === undefined) return "";
  if (f === "int") return String(Math.round(v));
  if (f === "pct") return tsvPct(v);
  if (f === "eur3") return tsvNum(v, 3);
  return tsvNum(v, 2);
};

function CuadroView({ year, setYear, gastos, mesesData, categorias, objetivos, leads, bienvenidas, leadsError, crmDoc, crmMes }) {
  const [copiado, setCopiado] = useState("");
  const [trim, setTrim] = useState(Math.floor(new Date().getMonth() / 3));
  const keys = MESES.map((_, i) => mesKey(year, i + 1));
  const secciones = useMemo(() => buildSecciones(objetivos), [objetivos]);

  // Columnas: Ene Feb Mar T1 | Abr May Jun T2 | ... | Anual
  const cols = [];
  [0, 1, 2, 3].forEach(t => {
    keys.slice(t * 3, t * 3 + 3).forEach((k, i) => cols.push({ label: MESES[t * 3 + i], keys: [k] }));
    cols.push({ label: `T${t + 1}`, keys: keys.slice(t * 3, t * 3 + 3), real: true });
  });
  cols.push({ label: "Anual", keys, real: true });

  const data = useMemo(() => cols.map(c => ({
    f: finMetrics(c.keys, gastos, mesesData, categorias),
    l: leadMetrics(leads, bienvenidas, `${c.keys[0]}-01`, lastDay(c.keys[c.keys.length - 1])),
    c: crmAgg(c.keys, crmDoc, crmMes),
  })), [year, gastos, mesesData, categorias, leads, bienvenidas, crmDoc, crmMes]);

  const copiar = (sec) => {
    const colIdx = [trim * 4, trim * 4 + 1, trim * 4 + 2, trim * 4 + 3];
    const lines = sec.filas.map(fila => colIdx.map(i => tsvBy(fila.get(data[i].f, data[i].l, data[i].c), fila.fmt)).join("\t"));
    const text = lines.join("\n");
    const done = () => { setCopiado(sec.nombre); setTimeout(() => setCopiado(""), 2500); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, () => fallbackCopy(text, done));
    else fallbackCopy(text, done);
  };

  return (
    <div>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: 10, marginBottom: 14 }}>
        <YearNav year={year} setYear={setYear} />
        <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
          <span style={label}>Trimestre para copiar</span>
          <select style={{ ...inputStyle, width: 90 }} value={trim} onChange={e => setTrim(Number(e.target.value))}>
            {[0, 1, 2, 3].map(t => <option key={t} value={t}>{t + 1}º</option>)}
          </select>
        </div>
      </div>
      {leadsError && <div style={{ ...card, borderColor: COLORS.amber, color: COLORS.amber, fontSize: 13 }}>No he podido leer la app de leads: {leadsError}. Las filas de conversaciones y ventas salen vacías.</div>}
      <div style={{ fontSize: 12.5, color: COLORS.muted, marginBottom: 10 }}>
        "Copiar" copia los 3 meses y el REAL del trimestre elegido. En el Excel de la academia, haz clic en la celda de la primera fila de la sección, en el primer mes del trimestre, y pega. {crmDoc ? "Las filas de clientes, renovaciones y bajas salen de tu CRM." : "Las filas marcadas \"CRM\" se rellenarán al conectar el CRM (arriba)."}
      </div>
      {secciones.map(sec => (
        <div key={sec.nombre} style={card}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 8, gap: 8 }}>
            <div><div style={{ fontWeight: 800, color: COLORS.navy }}>{sec.nombre}</div><div style={{ fontSize: 11.5, color: COLORS.muted }}>Hoja "{sec.hoja}"</div></div>
            {!sec.extra && <button style={btn} onClick={() => copiar(sec)}>{copiado === sec.nombre ? "Copiado ✓" : `Copiar T${trim + 1}`}</button>}
          </div>
          <div className="scroll-x">
            <table className="grid">
              <thead><tr><th style={{ minWidth: 150 }}>Métrica</th>{cols.map(c => <th key={c.label} style={c.real ? { background: "#eef5f8" } : null}>{c.label}</th>)}<th>Objetivo</th></tr></thead>
              <tbody>
                {sec.filas.map(fila => (
                  <tr key={fila.label}>
                    <td style={{ fontWeight: 600 }}>{fila.label} {fila.crm && !crmDoc && <Badge color={COLORS.primary}>CRM</Badge>}</td>
                    {cols.map((c, i) => {
                      const v = fila.get(data[i].f, data[i].l, data[i].c);
                      const ok = fila.ok && v !== null && v !== undefined ? fila.ok(v, data[i].f) : null;
                      return <td key={c.label} style={{ background: c.real ? "#f5f9fb" : null, fontWeight: c.real ? 700 : 400, color: ok === null ? COLORS.ink : (ok ? COLORS.green : COLORS.red) }}>{fmtBy(v, fila.fmt)}</td>;
                    })}
                    <td style={{ color: COLORS.muted }}>{fila.goal || ""}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      ))}
    </div>
  );
}
function fallbackCopy(text, done) {
  const ta = document.createElement("textarea"); ta.value = text; document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); done(); } catch (e) { alert("No he podido copiar. Selecciona la tabla a mano."); }
  document.body.removeChild(ta);
}

// ---------- Ajustes ----------
function AjustesView({ categorias, objetivos, gastos, actions }) {
  const [nueva, setNueva] = useState({ nombre: "", frecuencia: "mensual" });
  const [err, setErr] = useState("");
  const setCat = (i, patch) => actions.saveCategorias(categorias.map((c, j) => j === i ? { ...c, ...patch } : c));
  const move = (i, d) => { const a = [...categorias]; const j = i + d; if (j < 0 || j >= a.length) return; [a[i], a[j]] = [a[j], a[i]]; actions.saveCategorias(a); };
  const remove = (i) => {
    const c = categorias[i];
    if (gastos.some(g => g.categoria === c.nombre)) { alert(`"${c.nombre}" tiene gastos guardados. No la borro para no perder histórico.`); return; }
    actions.saveCategorias(categorias.filter((_, j) => j !== i));
  };
  const add = () => {
    const n = nueva.nombre.trim();
    if (!n) { setErr("Escribe un nombre"); return; }
    if (categorias.some(c => c.nombre.toLowerCase() === n.toLowerCase())) { setErr("Ya existe esa categoría"); return; }
    actions.saveCategorias([...categorias, { nombre: n, frecuencia: nueva.frecuencia }]);
    setNueva({ nombre: "", frecuencia: "mensual" }); setErr("");
  };
  const goalFields = [
    ["margen", "Margen de beneficio mínimo (%)"], ["cps", "Coste por seguidor máximo (€)"],
    ["renovacion", "% renovación mínimo"], ["indOut", "% inducción outbound mínimo"],
    ["indIn", "% inducción inbound mínimo"], ["showUp", "% show up mínimo"],
    ["cierre", "% cierre mínimo"], ["irpfPct", "IRPF a apartar (% del beneficio)"],
  ];
  return (
    <div>
      <div style={card}>
        <div style={{ fontWeight: 800, color: COLORS.navy, marginBottom: 4 }}>Categorías de gasto</div>
        <div style={{ fontSize: 12.5, color: COLORS.muted, marginBottom: 10 }}>Mensual: te propone el importe del mes anterior. Trimestral: el de hace 3 meses en enero, abril, julio y octubre. Puntual: te propone 0. Las marcadas como "Impuesto" no se restan en el % antes de impuestos.</div>
        {categorias.map((c, i) => (
          <div key={c.nombre} style={{ display: "grid", gridTemplateColumns: "minmax(0,1fr) auto 130px auto auto auto", gap: 6, alignItems: "center", padding: "5px 0", borderBottom: `1px solid ${COLORS.line}` }}>
            <div style={{ fontWeight: 600, fontSize: 14 }}>{c.nombre} {c.esPublicidad && <Badge color={COLORS.coral}>inversión ads</Badge>}</div>
            <label style={{ fontSize: 12, color: COLORS.muted, display: "flex", gap: 4, alignItems: "center", whiteSpace: "nowrap" }}>
              <input id={`imp-${i}`} type="checkbox" checked={esImpuesto(c)} onChange={e => setCat(i, { esImpuesto: e.target.checked })} /> Impuesto
            </label>
            <select style={inputStyle} value={c.frecuencia} onChange={e => setCat(i, { frecuencia: e.target.value })}>
              <option value="mensual">Mensual</option><option value="trimestral">Trimestral</option><option value="puntual">Puntual</option>
            </select>
            <button style={{ ...btn, padding: "6px 9px" }} onClick={() => move(i, -1)} aria-label="Subir">↑</button>
            <button style={{ ...btn, padding: "6px 9px" }} onClick={() => move(i, 1)} aria-label="Bajar">↓</button>
            <button style={{ ...btn, padding: "6px 9px" }} onClick={() => remove(i)} aria-label="Borrar">✕</button>
          </div>
        ))}
        <div style={{ display: "grid", gridTemplateColumns: "minmax(0,1fr) 130px auto", gap: 6, marginTop: 10 }}>
          <input style={inputStyle} placeholder="Nueva categoría" value={nueva.nombre} onChange={e => { setNueva({ ...nueva, nombre: e.target.value }); setErr(""); }} />
          <select style={inputStyle} value={nueva.frecuencia} onChange={e => setNueva({ ...nueva, frecuencia: e.target.value })}>
            <option value="mensual">Mensual</option><option value="trimestral">Trimestral</option><option value="puntual">Puntual</option>
          </select>
          <button style={btnPrimary} onClick={add}>Añadir</button>
        </div>
        {err && <div style={{ fontSize: 13, color: COLORS.red, marginTop: 6 }}>{err}</div>}
      </div>
      <div style={card}>
        <div style={{ fontWeight: 800, color: COLORS.navy, marginBottom: 10 }}>Objetivos</div>
        <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(220px, 1fr))", gap: 12 }}>
          {goalFields.map(([k, t]) => (
            <div key={k}><div style={label}>{t}</div>
              <NumInput width="100%" align="left" value={objetivos[k]} onSave={(n) => n !== null && actions.saveObjetivos({ ...objetivos, [k]: n })} /></div>
          ))}
        </div>
      </div>
    </div>
  );
}

// ---------- Acceso (login de Supabase) ----------
function App() {
  const [session, setSession] = useState(undefined); // undefined = comprobando
  useEffect(() => {
    supabase.auth.getSession().then(({ data }) => setSession(data.session || null));
    const { data: sub } = supabase.auth.onAuthStateChange((_e, s) => setSession(s || null));
    return () => sub && sub.subscription && sub.subscription.unsubscribe();
  }, []);
  if (session === undefined) return <div style={{ fontFamily: "Montserrat, system-ui, sans-serif", padding: 40, color: COLORS.muted, textAlign: "center" }}>Cargando…</div>;
  if (!session) return <LoginScreen />;
  return <Panel email={session.user && session.user.email} onLogout={() => { crmAuth.borrar(); supabase.auth.signOut(); }} />;
}

function LoginScreen() {
  const [email, setEmail] = useState("");
  const [pass, setPass] = useState("");
  const [err, setErr] = useState("");
  const [busy, setBusy] = useState(false);
  const submit = async (e) => {
    e.preventDefault();
    if (!email.trim() || !pass) { setErr("Escribe tu email y tu contraseña"); return; }
    setBusy(true); setErr("");
    const { error } = await supabase.auth.signInWithPassword({ email: email.trim(), password: pass });
    if (!error) { try { await crmAuth.login(email.trim(), pass); } catch (e) { /* si el CRM usa otra contraseña, se conecta luego desde la app */ } }
    setBusy(false);
    if (error) setErr(error.message === "Invalid login credentials" ? "Email o contraseña incorrectos" : error.message);
  };
  return (
    <div style={{ fontFamily: "Montserrat, system-ui, sans-serif", color: COLORS.ink, padding: "60px 16px", display: "flex", justifyContent: "center" }}>
      <form onSubmit={submit} style={{ ...card, width: "100%", maxWidth: 360, padding: "24px 22px" }}>
        <div style={{ fontSize: 12, fontWeight: 800, letterSpacing: 1, color: COLORS.coral }}>FUEL TO RUN</div>
        <div style={{ fontSize: 22, fontWeight: 800, color: COLORS.navy, marginBottom: 16 }}>Finanzas</div>
        <div style={label}>Email</div>
        <input id="login-email" type="email" autoComplete="username" style={{ ...inputStyle, marginBottom: 10 }} value={email} onChange={e => { setEmail(e.target.value); setErr(""); }} />
        <div style={label}>Contraseña</div>
        <input id="login-pass" type="password" autoComplete="current-password" style={{ ...inputStyle, marginBottom: 14 }} value={pass} onChange={e => { setPass(e.target.value); setErr(""); }} />
        {err && <div style={{ fontSize: 13, color: COLORS.red, marginBottom: 10 }}>{err}</div>}
        <button type="submit" style={{ ...btnPrimary, width: "100%" }}>{busy ? "Entrando…" : "Entrar"}</button>
        <div style={{ fontSize: 11.5, color: COLORS.muted, marginTop: 10 }}>Este dispositivo recordará la sesión hasta que pulses "Salir".</div>
      </form>
    </div>
  );
}

// Conectar el CRM (si usa otra contraseña o la sesión ha caducado)
function CrmConnect({ estado, error, onConectado }) {
  const [open, setOpen] = useState(false);
  const [email, setEmail] = useState("");
  const [pass, setPass] = useState("");
  const [err, setErr] = useState("");
  const [busy, setBusy] = useState(false);
  const go = async (e) => {
    e.preventDefault();
    if (!email.trim() || !pass) { setErr("Escribe el email y la contraseña de tu CRM"); return; }
    setBusy(true); setErr("");
    try { await crmAuth.login(email.trim(), pass); setBusy(false); onConectado(); }
    catch (e2) { setBusy(false); setErr(e2.message); }
  };
  return (
    <div style={{ ...card, borderColor: `${COLORS.primary}88`, background: "#f3f9fb" }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", gap: 10, flexWrap: "wrap" }}>
        <div style={{ fontSize: 13.5 }}>
          <b>CRM sin conectar.</b> {estado === "error" ? `No he podido leerlo (${error}).` : "Entra con el usuario de tu CRM para traer cobros, facturación y clientes."} La app solo lo lee, nunca lo modifica.
        </div>
        {!open && <button style={btnPrimary} onClick={() => setOpen(true)}>Conectar CRM</button>}
      </div>
      {open && (
        <form onSubmit={go} style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(170px, 1fr))", gap: 8, marginTop: 10, alignItems: "end" }}>
          <div><div style={label}>Email del CRM</div><input id="crm-email" type="email" autoComplete="username" style={inputStyle} value={email} onChange={e => { setEmail(e.target.value); setErr(""); }} /></div>
          <div><div style={label}>Contraseña del CRM</div><input id="crm-pass" type="password" autoComplete="current-password" style={inputStyle} value={pass} onChange={e => { setPass(e.target.value); setErr(""); }} /></div>
          <button type="submit" style={btnPrimary}>{busy ? "Conectando…" : "Conectar"}</button>
          {err && <div style={{ gridColumn: "1 / -1", fontSize: 13, color: COLORS.red }}>{err}</div>}
        </form>
      )}
    </div>
  );
}

// ---------- Panel ----------
function Panel({ email, onLogout }) {
  const [tab, setTab] = useState("cierre");
  const [mes, setMes] = useState(shiftMes(mesActual(), -1)); // por defecto, el mes que toca cerrar
  const [year, setYear] = useState(new Date().getFullYear());
  const [gastos, setGastos] = useState([]);
  const [mesesData, setMesesData] = useState({});
  const [categorias, setCategorias] = useState(DEFAULT_CATEGORIAS);
  const [objetivos, setObjetivos] = useState(DEFAULT_OBJETIVOS);
  const [leads, setLeads] = useState([]);
  const [bienvenidas, setBienvenidas] = useState([]);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState("");
  const [leadsError, setLeadsError] = useState("");
  const [saveError, setSaveError] = useState("");
  const [crmDoc, setCrmDoc] = useState(null);
  const [crmEstado, setCrmEstado] = useState("cargando"); // conectado | sin-sesion | error
  const [crmError, setCrmError] = useState("");

  const load = async () => {
    setLoading(true); setError("");
    try {
      const [g, m, c] = await Promise.all([db.gastos(), db.meses(), db.config()]);
      setGastos(g || []);
      const mm = {}; (m || []).forEach(r => { mm[r.mes] = r; }); setMesesData(mm);
      const cfg = {}; (c || []).forEach(r => { cfg[r.clave] = r.valor; });
      if (Array.isArray(cfg.categorias) && cfg.categorias.length) setCategorias(cfg.categorias);
      if (cfg.objetivos) setObjetivos({ ...DEFAULT_OBJETIVOS, ...cfg.objetivos });
    } catch (e) { setError(e.message || String(e)); }
    try {
      const [l, b] = await Promise.all([db.leads(), db.bienvenidas()]);
      setLeads(l || []); setBienvenidas(b || []); setLeadsError("");
    } catch (e) { setLeadsError(e.message || String(e)); }
    try {
      const d = await cargarCRM();
      setCrmDoc(d); setCrmEstado(d ? "conectado" : "sin-sesion"); setCrmError("");
    } catch (e) { setCrmDoc(null); setCrmEstado("error"); setCrmError(e.message || String(e)); }
    setLoading(false);
  };
  useEffect(() => { load(); }, []);

  // Cada cambio se aplica en pantalla y se guarda; si falla el guardado, se avisa y se recarga lo que hay en Supabase
  const guard = async (fn) => {
    try { await fn(); setSaveError(""); }
    catch (e) { setSaveError("No se ha guardado el último cambio: " + (e.message || e) + ". He recargado los datos."); load(); }
  };
  const actions = {
    addGastos: (rows) => { setGastos(prev => [...prev, ...rows]); guard(() => db.upsertGastos(rows)); },
    updateGasto: (row) => { setGastos(prev => prev.map(g => g.id === row.id ? row : g)); guard(() => db.upsertGasto(row)); },
    deleteGasto: (id) => { setGastos(prev => prev.filter(g => g.id !== id)); guard(() => db.deleteGasto(id)); },
    updateMes: (key, patch) => {
      const row = { ...(mesesData[key] || { mes: key }), ...patch, mes: key };
      setMesesData(prev => ({ ...prev, [key]: row })); guard(() => db.upsertMes(row));
    },
    saveCategorias: (cats) => { setCategorias(cats); guard(() => db.upsertConfig("categorias", cats)); },
    saveObjetivos: (o) => { setObjetivos(o); guard(() => db.upsertConfig("objetivos", o)); },
  };

  // Datos de cada mes: lo que escribes a mano manda; si está vacío, se usa el CRM
  const crmMes = useMemo(() => crmDoc ? crmPorMes(crmDoc) : {}, [crmDoc]);
  const mesesEff = useMemo(() => {
    const out = { ...mesesData };
    Object.entries(crmMes).forEach(([k, c]) => {
      const md = out[k] || { mes: k };
      out[k] = {
        ...md,
        cobrado: md.cobrado !== null && md.cobrado !== undefined ? md.cobrado : (c.nCobros ? round2(c.cobrado) : null),
        facturacion: md.facturacion !== null && md.facturacion !== undefined ? md.facturacion : (c.nVentas ? round2(c.facturacion) : null),
      };
    });
    return out;
  }, [mesesData, crmMes]);

  const tabs = [["cierre", "Cierre de mes"], ["resultado", "Resultado"], ["cuadro", "Cuadro de mandos"], ["ajustes", "Ajustes"]];

  return (
    <div style={{ fontFamily: "Montserrat, system-ui, sans-serif", color: COLORS.ink, padding: "18px 16px 40px" }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: 10, marginBottom: 14 }}>
        <div>
          <div style={{ fontSize: 12, fontWeight: 800, letterSpacing: 1, color: COLORS.coral }}>FUEL TO RUN</div>
          <div style={{ fontSize: 22, fontWeight: 800, color: COLORS.navy }}>Finanzas</div>
        </div>
        <div style={{ display: "flex", gap: 6, alignItems: "center" }}>
          <button style={btn} onClick={load}>{loading ? "Cargando…" : "Actualizar"}</button>
          <button style={btn} onClick={onLogout} title={email || ""}>Salir</button>
        </div>
      </div>
      <div style={{ display: "flex", gap: 6, marginBottom: 16, overflowX: "auto" }}>
        {tabs.map(([k, t]) => (
          <button key={k} onClick={() => setTab(k)} style={{ ...btn, whiteSpace: "nowrap", background: tab === k ? COLORS.navy : COLORS.paper, color: tab === k ? "#fff" : COLORS.ink, borderColor: tab === k ? COLORS.navy : COLORS.line }}>{t}</button>
        ))}
      </div>
      {error && <div style={{ ...card, borderColor: COLORS.red, color: COLORS.red }}>No he podido cargar tus datos de finanzas: {error}. No toques nada hasta que vuelva a cargar (pulsa Actualizar).</div>}
      {saveError && <div style={{ ...card, borderColor: COLORS.red, color: COLORS.red, fontSize: 13 }}>{saveError}</div>}
      {!loading && crmEstado !== "conectado" && <CrmConnect estado={crmEstado} error={crmError} onConectado={load} />}
      {!error && !loading && (
        <ErrorBoundary key={tab}>
          {tab === "cierre" && <CierreView mes={mes} setMes={setMes} gastos={gastos} mesesData={mesesData} mesesEff={mesesEff} crmMes={crmDoc ? crmMes : null} categorias={categorias} objetivos={objetivos} actions={actions} />}
          {tab === "resultado" && <ResultadoView year={year} setYear={setYear} gastos={gastos} mesesData={mesesEff} categorias={categorias} objetivos={objetivos} />}
          {tab === "cuadro" && <CuadroView crmDoc={crmDoc} crmMes={crmMes} year={year} setYear={setYear} gastos={gastos} mesesData={mesesEff} categorias={categorias} objetivos={objetivos} leads={leads} bienvenidas={bienvenidas} leadsError={leadsError} />}
          {tab === "ajustes" && <AjustesView categorias={categorias} objetivos={objetivos} gastos={gastos} actions={actions} />}
        </ErrorBoundary>
      )}
    </div>
  );
}
</script>

<script>
  try {
    var source = document.getElementById("app-source").textContent;
    var compiled = Babel.transform(source, { presets: [["react", { runtime: "classic" }]] }).code;
    var runApp = new Function("React", "window", "document", compiled + "\n; ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));");
    runApp(React, window, document);
  } catch (err) {
    document.getElementById("root").innerHTML =
      '<div style="padding:24px;font-family:sans-serif;color:#c0392b;white-space:pre-wrap;">Error al cargar la app:\n' +
      (err && err.message ? err.message : err) + '</div>';
    console.error(err);
  }
</script>
</body>
